name: Build XNU arm64

on:
  push:
    branches: [redwood-port]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --show-sdk-path
          xcrun --sdk macosx --show-sdk-version

      - name: Fetch build dependencies
        run: |
          exec > >(tee deps.log) 2>&1
          set -x
          curl -fsSL -o av.tar.gz \
            https://github.com/apple-oss-distributions/AvailabilityVersions/archive/refs/tags/AvailabilityVersions-32.30.1.tar.gz
          tar xzf av.tar.gz
          cd AvailabilityVersions-*
          sudo make install SRCROOT=$PWD DSTROOT=/ || echo "WARN: av install rc=$?"
          cd ..

          curl -fsSL -o ld.tar.gz \
            https://github.com/apple-oss-distributions/libdispatch/archive/refs/tags/libdispatch-913.30.4.tar.gz
          tar xzf ld.tar.gz
          cd libdispatch-*
          mkdir -p obj sym dst
          xcodebuild install -sdk macosx -target libfirehose_kernel \
            SRCROOT=$PWD OBJROOT=$PWD/obj SYMROOT=$PWD/sym DSTROOT=$PWD/dst \
            ENABLE_BITCODE=no CODE_SIGNING_ALLOWED=never -quiet || echo "WARN: firehose rc=$?"
          sudo ditto $PWD/dst/usr/local / || true
          cd ..

          curl -fsSL -o dt.tar.gz \
            https://github.com/apple-oss-distributions/dtrace/archive/refs/tags/dtrace-262.tar.gz
          tar xzf dt.tar.gz
          cd dtrace-262
          mkdir -p obj sym dst
          xcodebuild install -target ctfconvert -target ctfdump -target ctfmerge \
            ARCHS=x86_64 SRCROOT=$PWD OBJROOT=$PWD/obj SYMROOT=$PWD/sym DSTROOT=$PWD/dst \
            CODE_SIGNING_ALLOWED=never -quiet || echo "WARN: dtrace rc=$?"
          echo "=== dtrace build products ==="
          find $PWD/dst -type f | head -30
          sudo find $PWD/dst -type f -name "ctf*" -exec cp {} /usr/local/bin/ \; || true
          sudo chmod +x /usr/local/bin/ctf* 2>/dev/null || true
          ls -la /usr/local/bin/ctf* || echo "WARN: no ctf tools"
          exit 0

      - name: Build XNU (DEVELOPMENT, ARM64)
        run: |
          set -o pipefail
          make SDKROOT=macosx ARCH_CONFIGS=ARM64 KERNEL_CONFIGS=DEVELOPMENT \
            BUILD_WERROR=0 BUILD_STABS=1 -j$(sysctl -n hw.ncpu) 2>&1 | tee build.log
          echo "## Build tail" >> $GITHUB_STEP_SUMMARY
          tail -50 build.log >> $GITHUB_STEP_SUMMARY || true

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p out
          echo "=== all mach* files in BUILD ==="
          find BUILD -type f -name "mach*" | head -30 | tee -a build.log || true
          # bootable image is mach_kernel (README: $(OBJROOT)/.../mach_kernel), symbols: mach_kernel.sys / *.unstripped
          find BUILD -type f -name "mach_kernel"   -exec cp {} out/mach_kernel.development.arm64 \;
          find BUILD -type f -name "mach_kernel.sys" -exec cp {} out/ \; || true
          find BUILD -type f -name "*.unstripped"  -exec cp {} out/ \; || true
          cp build.log deps.log out/ 2>/dev/null || true
          ls -la out/

      - name: Compute SHA256
        run: |
          cd out && shasum -a 256 * | tee SHA256SUMS

      - name: Push build log to logs branch
        if: always()
        run: |
          git config user.name "ci-log"
          git config user.email "ci@log"
          git fetch origin logs || true
          git checkout logs 2>/dev/null || git checkout --orphan logs
          git rm -rf --cached . -q 2>/dev/null || true
          mkdir -p logs/run-$GITHUB_RUN_NUMBER
          cp out/* logs/run-$GITHUB_RUN_NUMBER/ 2>/dev/null || true
          cp build.log deps.log logs/run-$GITHUB_RUN_NUMBER/ 2>/dev/null || true
          git add -f logs/run-$GITHUB_RUN_NUMBER || true
          git commit -m "build log run $GITHUB_RUN_NUMBER" || true
          git push origin logs || true

      - uses: actions/upload-artifact@v4
        with:
          name: xnu-arm64-${{ github.run_number }}
          path: out/
          if-no-files-found: warn
